# Render Blueprint — 固定URLで常時公開
# https://dashboard.render.com/ → New → Blueprint → このリポジトリを選択

services:
  - type: web
    name: wellsupo-staff-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SHARED_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: ナリカワ
